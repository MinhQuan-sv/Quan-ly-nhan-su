# =====================================================================
# Cấu hình kết nối CSDL - Ứng dụng Quản lý Nhân sự & Chấm công
# File được util.KetNoiCSDL đọc (ưu tiên file ở thư mục chạy, rồi classpath).
# Sửa trực tiếp, KHÔNG cần biên dịch lại.
#
# ĐANG DÙNG: SQL Server (cấu hình đã chạy được trên máy này)
# =====================================================================

db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhanSu;encrypt=true;trustServerCertificate=true;loginTimeout=10
db.user=sa
db.password=123456

# ---------------------------------------------------------------------
# CHUYỂN SANG MySQL (làm đúng 3 bước):
#   1) Tải MySQL Connector/J và chép vào lib\:
#        lib\mysql-connector-j-8.4.0.jar
#   2) Bỏ dấu # ở 4 dòng MySQL bên dưới, thêm # vào 4 dòng SQL Server phía trên
#   3) Điền mật khẩu MySQL của bạn vào db.password, rồi nạp script MySQL:
#        java -cp "out;lib/*" tools\ChayScriptSQL.java database/mysql/QuanLyNhanSu.sql
